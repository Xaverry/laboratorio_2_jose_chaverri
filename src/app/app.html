
<main>

  <header class="navbar">

    <h2>Sistema de Inventario</h2>

    @if (authService.estaAutenticado()) {

      <nav>

        <a routerLink="/productos">
          Productos
        </a>

        <a routerLink="/categorias">
          Categorías
        </a>

        @if (authService.esAdmin()) {
          <a routerLink="/usuarios">
            Usuarios
          </a>
        }

      </nav>

      <div class="usuario-info">

        <span>
          {{ authService.usuarioActual()?.userName }}
          ({{ authService.usuarioActual()?.rol }})
        </span>

        <button type="button" (click)="cerrarSesion()">
          Cerrar sesión
        </button>

      </div>

    } @else {

      <nav>
        <a routerLink="/login">Iniciar sesión</a>
        <a routerLink="/registro">Registrarse</a>
      </nav>

    }

  </header>

  <section class="content">
    <router-outlet />
  </section>

</main>
